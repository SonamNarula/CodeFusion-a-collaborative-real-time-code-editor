<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="CodeFusion banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d14"/>
      <stop offset="0.55" stop-color="#14122b"/>
      <stop offset="1" stop-color="#0c1a24"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5a5ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#6e6ee0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6e6ee0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.8" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glowA)"/>
  <rect width="1280" height="320" rx="20" fill="url(#glowB)"/>

  <!-- title block -->
  <text x="80" y="150" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#title)">CodeFusion</text>
  <text x="84" y="196" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="26" fill="#c9cdd9">Two people. One file. Nobody loses a keystroke.</text>
  <text x="84" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#7d849a" letter-spacing="1">CRDT SYNC  ·  SHARED EXECUTION  ·  AI PAIRING  ·  SESSION REPLAY</text>

  <!-- floating code fragment with two cursors -->
  <g transform="translate(800 78)">
    <rect width="400" height="164" rx="14" fill="#0f1218" stroke="#2a3042" stroke-width="1.5"/>
    <circle cx="22" cy="20" r="5" fill="#ff5f57"/><circle cx="40" cy="20" r="5" fill="#febc2e"/><circle cx="58" cy="20" r="5" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <text x="24" y="62"><tspan fill="#c792ea">function</tspan> <tspan fill="#82aaff">fib</tspan><tspan fill="#c9cdd9">(n) {</tspan></text>
      <text x="24" y="90" fill="#c9cdd9">  <tspan fill="#c792ea">if</tspan> (n &lt; <tspan fill="#f78c6c">2</tspan>) <tspan fill="#c792ea">return</tspan> n;</text>
      <text x="24" y="118" fill="#c9cdd9">  <tspan fill="#c792ea">return</tspan> fib(n-<tspan fill="#f78c6c">1</tspan>) + fib(n-<tspan fill="#f78c6c">2</tspan>);</text>
      <text x="24" y="146" fill="#c9cdd9">}</text>
    </g>
    <!-- cursor 1 -->
    <rect x="252" y="72" width="2" height="22" fill="#8b8bff"/>
    <rect x="256" y="70" width="58" height="18" rx="4" fill="#6e6ee0"/>
    <text x="263" y="83" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff">Sonam</text>
    <!-- cursor 2 -->
    <rect x="306" y="100" width="2" height="22" fill="#2dd4bf"/>
    <rect x="310" y="122" width="54" height="18" rx="4" fill="#14b8a6"/>
    <text x="317" y="135" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" fill="#052e2b">Aarav</text>
  </g>
</svg>
